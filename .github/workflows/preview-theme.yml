name: Build Theme Preview EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ttkbootstrap
          pip install pyinstaller

      - name: Build Preview EXE
        run: |
          pyinstaller --onefile --windowed --clean --name "ThemePreview" `
            --add-data "dummy_tools.json;." `
            --collect-all ttkbootstrap `
            preview_ttkbootstrap.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThemePreview
          path: dist/ThemePreview.exe
